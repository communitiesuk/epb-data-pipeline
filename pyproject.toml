[project]
name = "epb-data-pipeline"
version = "0.1.0"
description = "EPB cloud ETL repository"
readme = "README.md"
authors = [
    { name = "christinehorrocks", email = "christine.horrocks@communities.gov.uk" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.117",
    "pyspark~=3.5.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
