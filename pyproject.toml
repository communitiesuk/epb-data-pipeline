[project]
name = "epb-data-pipeline"
version = "0.1.0"
description = "EPB cloud ETL repository"
readme = "README.md"
authors = [
    { name = "christinehorrocks", email = "christine.horrocks@communities.gov.uk" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.117",
    "pyspark~=3.5.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false
required-version = "0.13.6"
