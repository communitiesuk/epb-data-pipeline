version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "pyspark"
        update-types: [ "version-update:semver-major", "version-update:semver-minor" ]

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
